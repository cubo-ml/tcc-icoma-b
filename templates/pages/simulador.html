<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SkillBloom — Office Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
{% raw %}
<style>
:root{--ink:#e4eef8;--mut:#8da3b8;--line:#1e3b57;--ac:#3d9bff;--warn:#e0a82e;--bad:#ff6b88;--pn:#0b1622;--pn2:#101f30}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#070d14;color:var(--ink);font:14px Inter,Arial,sans-serif}
#scene{position:fixed;inset:0}#scene canvas{display:block;width:100%;height:100%;touch-action:none}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}.hidden{display:none!important}
.ic{width:18px;height:18px;flex:none}
header{position:fixed;top:0;left:0;right:0;height:56px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;background:#070d14d9;border-bottom:1px solid var(--line);backdrop-filter:blur(10px);z-index:10}
.brand{font-weight:700;font-size:18px}.brand b{color:var(--ac)}
.hc{display:flex;gap:14px;align-items:baseline;color:var(--mut)}#clock{font-size:20px;font-weight:700;color:var(--ink)}
.hr{display:flex;gap:8px;align-items:center}#status{color:var(--bad);margin-right:8px;font-size:12px}
.ds{display:none}
.hr button{background:var(--pn);border:1px solid var(--line);color:var(--ink);padding:7px 12px;border-radius:7px}.hr button:hover{border-color:var(--ac)}
#tasksP{position:fixed;right:16px;top:72px;width:290px;max-height:calc(100vh - 170px);overflow:auto;z-index:9;background:#0b1622ea;border:1px solid var(--line);border-radius:12px;padding:12px 14px;backdrop-filter:blur(10px);box-shadow:0 10px 30px #00000066}
#tgl{display:none}
.pt{font-weight:600;margin-bottom:4px}
.tk{display:flex;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}.tk:last-child{border:0}.tk:hover{background:#12263a}
.pd{width:9px;height:9px;margin-top:5px;border-radius:50%;background:var(--ac);flex:none}.tk.p2 .pd{background:var(--warn)}.tk.p3 .pd{background:var(--bad)}
.tk b{display:block;font-size:13px}.tk small{color:var(--mut);font-size:12px;line-height:1.35}
.vazio{padding:12px 0;text-align:center;color:var(--mut)}
#nav{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:10px;z-index:9}
#nav button{display:flex;align-items:center;gap:8px;background:#0b1622e6;border:1px solid var(--line);color:var(--ink);padding:11px 16px;border-radius:10px}
#nav button.on{background:var(--ac);border-color:var(--ac);color:#04142b}
#hint{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);font-size:12px;color:var(--mut);background:#070d14cc;padding:6px 14px;border-radius:20px;z-index:9;white-space:nowrap}
.ov{position:fixed;inset:0;z-index:50;background:#000000aa;backdrop-filter:blur(4px);display:grid;place-items:center}#popup,#over{z-index:90}
.card{width:min(960px,94vw);height:min(580px,80vh);background:var(--pn);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px #000000aa}
.card.sm{width:460px;height:auto;padding:26px;text-align:center}.card.sm h2{margin:0 0 10px}.card.sm p{color:var(--mut);line-height:1.6;margin:0 0 16px}
.ch{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--pn2)}.ch h2{margin:0;font-size:15px;display:flex;align-items:center;gap:9px;flex:1}
#ptabs{display:flex;gap:6px}#ptabs button{background:none;border:1px solid transparent;color:var(--mut);padding:7px 11px;border-radius:7px}#ptabs button.on{background:#12304d;border-color:var(--ac);color:var(--ink)}
.x{background:none;border:0;color:var(--mut);font-size:24px}
#pbody{flex:1;overflow:auto;padding:16px}
.split{display:grid;grid-template-columns:280px 1fr;gap:14px;height:100%}.list,.view{overflow:auto}.view{background:var(--pn2);border:1px solid var(--line);border-radius:10px;padding:16px}.view h3{margin:0 0 4px}
.empty{text-align:center;color:var(--mut);padding:60px 10px}.mut{color:var(--mut);font-size:12px}
.ob,.pri{display:block;width:100%;text-align:left;margin-top:8px;background:var(--pn2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:11px 13px;line-height:1.4}.ob:hover{border-color:var(--ac);background:#12304d}
.pri{text-align:center;background:var(--ac);color:#04142b;font-weight:600;border:0}
.row{display:flex;gap:8px;flex-wrap:wrap}.row button{margin-top:8px;background:var(--pn2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 13px}.row button:hover{border-color:var(--ac)}
.doc{background:var(--pn2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px}.doc h3{margin:0 0 4px;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.kpi{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--pn2)}.kpi span{font-size:12px;color:var(--mut)}.kpi b{display:block;margin:4px 0 8px;font-size:22px}
.bar{display:block;height:5px;border-radius:9px;background:#1a2f45;overflow:hidden}.bar u{display:block;height:100%;background:var(--ac)}
.kline{font-size:13px;color:var(--mut)}
#toasts{position:fixed;right:20px;bottom:24px;z-index:95;display:flex;flex-direction:column;gap:7px}
.toast{background:var(--pn);border:1px solid var(--line);color:var(--ink);padding:10px 14px;border-radius:8px;font-size:13px;max-width:320px;box-shadow:0 8px 24px #00000066;animation:t .25s}@keyframes t{from{opacity:0;transform:translateY(8px)}}
@media(max-width:900px){#tasksP{width:240px}.split{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}#nav button span{display:none}}
@media(max-width:700px){
html,body{overscroll-behavior:none}
.card.sm{max-width:92vw}
.dl{display:none}.ds{display:inline}
header{height:calc(52px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0}
.hc #dayInfo,#status,#hint,.hr .hm{display:none}
#tasksP{left:10px;right:10px;width:auto;top:auto;bottom:calc(140px + env(safe-area-inset-bottom));max-height:38vh;display:none}
#tasksP.open{display:block}
#tgl{display:flex;align-items:center;gap:6px;position:fixed;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:11;background:var(--ac);color:#04142b;border:0;border-radius:20px;padding:10px 14px;font-weight:700}
#nav{left:10px;right:10px;transform:none;bottom:calc(14px + env(safe-area-inset-bottom))}
#nav button{flex:1;justify-content:center;min-height:50px}
#panel .card{width:100vw;height:100vh;height:100dvh;border-radius:0}
#panel .ch{flex-wrap:wrap;padding-top:calc(12px + env(safe-area-inset-top))}
#ptabs{order:3;width:100%;overflow-x:auto}
.ob{padding:14px;font-size:15px}.row button{padding:12px 14px}
#toasts{right:10px;bottom:calc(150px + env(safe-area-inset-bottom))}
}
</style>
{% endraw %}
</head>
<body>
<div id="scene"></div>

<header>
  <div class="brand">Skill<b>Bloom</b></div>
  <div class="hc"><span id="clock">08:00</span><span id="dayInfo"></span></div>
  <div class="hr"><span id="status"></span><button onclick="location.href='/dash'"><span class="dl">Meu desempenho</span><span class="ds">Desempenho</span></button><button class="hm" onclick="save();toast('Progresso salvo.')">Salvar</button><button class="hm" onclick="help()">Controles</button></div>
</header>

<aside id="tasksP"><div class="pt">Tarefas</div><div id="tasks"></div></aside>
<button id="tgl" onclick="$('tasksP').classList.toggle('open')">Tarefas <b id="tglN">0</b></button>
<nav id="nav"></nav>
<div id="hint">Clique nos objetos · A / D vira a câmera · E interage · TAB próxima tarefa</div>

<div id="panel" class="ov hidden"><div class="card">
  <div class="ch"><h2 id="ptitle"></h2><div id="ptabs"></div><button class="x" onclick="closePanel()">×</button></div>
  <div id="pbody"></div>
</div></div>
<div id="popup" class="ov hidden"><div class="card sm"><h2 id="popT"></h2><p id="popX"></p><button class="pri" onclick="closePopup()">Continuar</button></div></div>
<div id="over" class="ov hidden"><div class="card sm"><h2>Expediente encerrado</h2><p id="overX"></p><button class="pri" onclick="location.reload()">Reiniciar</button></div></div>
<div id="toasts"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
{% raw %}
<script>
"use strict";
const $=i=>document.getElementById(i),clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v)),pick=a=>a[Math.random()*a.length|0],rnd=(a,b)=>a+(Math.random()*(b-a)|0),shuf=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const COARSE=matchMedia('(pointer:coarse)').matches;
const IC={mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',users:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.5 3-6 6-6s6 2.5 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.5 0 4 2 4 5"/>',phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A15 15 0 0 1 3 6a2 2 0 0 1 2-2z"/>',printer:'<path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/>',monitor:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>'};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;

// ---------- CONTEÚDO: cada opção = [texto, efeitos, feedback]; ordem fixa: certa, meio-termo, errada ----------
// (a ordem na TELA é sorteada pelo spawn(), então a certa não fica sempre no mesmo lugar)
const Q={
email:[
{t:'Feedback duro no relatório',f:'Diretoria',b:'"Isso está muito abaixo do esperado. Refaça tudo." Sem mais explicações, e com sua chefe em cópia.',o:[
['Esperar a irritação passar e depois responder pedindo exemplos do que precisa melhorar.',{self:6,com:3,rep:4},'Você deixou a emoção baixar antes de agir e pediu informação concreta. Isso é autogestão: transforma uma crítica vaga em um plano.'],
['Refazer o relatório inteiro do zero, sem perguntar à diretoria o que estava errado nele.',{self:-2,prob:-1,energy:-10},'Sem saber o que faltou, você pode gastar horas e errar de novo. Uma pergunta curta teria poupado tempo e energia.'],
['Responder na hora, com a chefe em cópia, dizendo que o prazo curto atrapalhou o trabalho.',{self:-5,com:-2,rep:-6},'Responder no calor do momento e com a chefe em cópia soa como defesa e justificativa. Esperar um pouco muda o tom da conversa.']]},
{t:'Entrega atrasada',f:'Cliente Alfa',b:'"Nosso pedido está 3 dias atrasado e a equipe está furiosa. Quero explicações."',o:[
['Reconhecer o transtorno, explicar o que houve sem rodeios e informar uma nova data firme.',{com:6,emp:3,cust:8},'Você validou a frustração, foi transparente e deu um próximo passo concreto. Isso reconstrói a confiança.'],
['Pedir desculpas e garantir que não vai se repetir, sem informar uma nova data de entrega.',{com:-2,cust:2},'O pedido de desculpas ajuda, mas sem uma data o cliente continua sem saber quando recebe. A promessa vaga não resolve.'],
['Explicar que o atraso foi culpa da transportadora e que a empresa não podia ter evitado.',{com:-4,cust:-6,rep:-4},'Jogar a culpa para fora soa como desculpa. O cliente quer responsabilidade e solução, não um culpado.']]},
{t:'Pedido de ajuda',f:'Bruno, colega',b:'"Sei que sua semana está cheia, mas consegue revisar minha apresentação hoje? Estou travado."',o:[
['Revisar por 15 minutos hoje e combinar o resto para amanhã, explicando a minha agenda.',{team:6,com:3,self:3},'Você ajudou sem se sobrecarregar e deixou seu limite claro. Cooperar e proteger a própria energia caminham juntos.'],
['Aceitar o pedido e ficar até mais tarde para revisar a apresentação inteira ainda hoje.',{team:-3,self:-2,energy:-12},'Dizer sim a tudo cobra um preço: cansado, você entrega pior, e a ajuda sem limites vira ressentimento.'],
['Responder que a minha semana está cheia e que ele precisará pedir ajuda a outra pessoa.',{team:-5,soc:-4},'Recusar é legítimo, mas sem acolher nem oferecer alternativa o colega se sente sozinho. Dá para dizer não com cuidado.']]},
{t:'Três pedidos urgentes',f:'Financeiro, Diretoria e Comercial',b:'As três áreas pedem "para ontem": fechamento de caixa, uma proposta e dados para a reunião.',o:[
['Listar o prazo e o impacto de cada pedido e combinar com as áreas o que sai primeiro.',{prob:6,com:3,rep:3},'Priorizar por impacto e alinhar expectativas evita promessas que você não cumpre. É resolução de problemas com comunicação.'],
['Fazer os pedidos na ordem em que chegaram, avisando cada área quando o seu ficar pronto.',{prob:-2,rep:-2,com:1},'A ordem de chegada nem sempre é a ordem de importância. Sem avaliar o impacto, o pedido mais crítico pode atrasar.'],
['Prometer os três para hoje à tarde e trabalhar sem pausas até conseguir entregar tudo.',{prob:-5,self:-3,rep:-5,energy:-10},'Prometer o impossível gera estresse e quebra de confiança. É melhor dizer o que é viável.']]},
{t:'Discussão por e-mail',f:'Carla e Diego, com você em cópia',b:'Os dois trocam acusações na conversa: "Você nunca avisa nada" e "E você nunca lê o que eu mando".',o:[
['Chamar os dois para uma conversa rápida e pedir que cada um diga o que precisa do outro.',{team:6,com:3,soc:4},'Tirar o conflito do e-mail e focar em necessidades reduz a defensiva. Mediar é uma competência de equipe.'],
['Escrever aos dois pedindo calma e que resolvam essa questão entre eles, fora do e-mail.',{team:-2,soc:1},'Pedir calma é bom, mas sem ajudar a mediar a briga costuma continuar em outro lugar.'],
['Responder a todos dando razão à Carla, pois o Diego realmente costuma esquecer de avisar.',{team:-5,soc:-6,emp:-2},'Tomar partido publicamente reforça a briga. Os dois precisam se sentir ouvidos.']]},
{t:'URGENTE: conta bloqueada',f:'banco-seguranca@avisos-online.net',b:'"Detectamos atividade suspeita. Clique agora para evitar o bloqueio."',o:[
['Não clicar no link, encaminhar a mensagem para a TI e avisar o resto da equipe.',{prob:6,team:3,rep:4},'Urgência artificial é sinal clássico de golpe. Avisar a TI protege toda a equipe.'],
['Não clicar no link e apagar a mensagem, sem avisar a TI nem os outros colegas.',{prob:2,team:-1},'Você se protegeu, mas o time continua exposto. Compartilhar o alerta é cuidar do coletivo.'],
['Clicar no link para conferir se a conta realmente tem alguma atividade suspeita.',{prob:-5,self:-3,rep:-8,money:-200},'Pressa é a arma do golpe. Respirar antes de agir é autogestão.']]},
{t:'Erro na tabela de preços',f:'Thiago, colega',b:'Você notou que a tabela de preços enviada ao cliente tem um valor trocado. O Thiago ainda não percebeu.',o:[
['Avisar o Thiago em particular, mostrar o valor certo e sugerir que ele corrija hoje.',{team:6,com:3,cust:4},'Você protegeu o cliente e o colega ao mesmo tempo: falou em particular e deu a ele a chance de corrigir.'],
['Corrigir a tabela por conta própria e reenviar ao cliente, sem contar nada ao Thiago.',{team:-2,prob:1,cust:2},'O erro some, mas o Thiago não aprende e pode se sentir desautorizado quando descobrir.'],
['Comentar no grupo da equipe que o Thiago errou na tabela de preços enviada ao cliente.',{team:-5,soc:-6,rep:-2},'Expor o erro de alguém em público gera constrangimento e desconfiança. Feedback pede privacidade.']]},
{t:'Reunião sem pauta',f:'Renata, gerente',b:'"Reunião hoje às 15h, duas horas, presença de todos." O convite não traz pauta e você tem uma entrega às 16h.',o:[
['Perguntar sobre a pauta, avisar da entrega das 16h e combinar como participar da reunião.',{com:6,prob:3,rep:3},'Você deu informação e abriu uma negociação. Comunicar o conflito cedo evita que alguém seja pego de surpresa.'],
['Aceitar o convite e tentar adiantar a entrega das 16h enquanto a reunião estiver rolando.',{com:-2,prob:-1,rep:-2},'Fazer duas coisas ao mesmo tempo costuma piorar as duas, e ninguém sabe que você tem um prazo apertado.'],
['Recusar o convite sem explicar nada e seguir trabalhando para terminar a entrega no prazo.',{com:-5,rep:-5,soc:-2},'Recusar sem explicação passa desinteresse e pode ser lido como falta de respeito com a gerente.']]},
{t:'Elogio da diretoria',f:'Diretoria',b:'"Parabéns pelo projeto novo! Excelente trabalho." Mas duas colegas fizeram boa parte do que foi entregue.',o:[
['Agradecer o elogio e citar as duas colegas pelo nome, dizendo o que cada uma entregou.',{team:6,com:3,soc:5},'Dar crédito de forma específica fortalece a confiança e mostra que você valoriza quem trabalha com você.'],
['Agradecer o elogio e dizer que foi um trabalho de equipe, sem citar ninguém por nome.',{team:2,soc:1},'Dizer que foi da equipe é um bom começo, mas sem nomes as colegas continuam invisíveis para a diretoria.'],
['Apenas agradecer e deixar o elogio como está, já que ninguém mais foi mencionado ali.',{team:-4,soc:-5,self:-2},'Aceitar um crédito que não é só seu gera ressentimento e mina a confiança da equipe.']]},
{t:'Prazo impossível',f:'Henrique, cliente',b:'"Preciso da proposta completa até amanhã cedo." O prazo normal para esse tipo de proposta é de cinco dias.',o:[
['Dizer o que dá para entregar até amanhã e propor a versão completa em uma data realista.',{prob:6,com:4,cust:5},'Você não disse só sim ou não: ofereceu uma entrega parcial e um prazo possível. Negociar mantém o cliente por perto.'],
['Aceitar o prazo e trabalhar à noite para entregar tudo, mesmo que sem tempo de revisar.',{prob:-2,self:-1,energy:-12},'Dizer sim a tudo gera uma proposta cansada e cheia de risco de erro. O cliente também fica mal acostumado.'],
['Dizer que o prazo é impossível e que ele deveria ter pedido a proposta com antecedência.',{prob:-4,com:-2,cust:-7,rep:-4},'Apontar o erro do cliente não resolve nada. Ele quer uma saída, não uma bronca.']]}],
emp:[
{t:'Conversa com Marina',f:'Equipe',b:'Marina está quieta há dias, evita o almoço e responde sem olhar para você: "Tá tudo bem, só estou cansada."',o:[
['Dizer que a notei diferente e convidar para um café, sem pressionar para que ela fale.',{emp:6,soc:5,team:2},'Você percebeu o sinal por trás das palavras e abriu espaço sem pressionar. Empatia é notar e oferecer apoio.'],
['Respeitar o que ela disse e deixar a porta aberta, sem voltar ao assunto por alguns dias.',{emp:-2,soc:-1},'Respeitar é válido, mas o tom dela contradizia as palavras. Um convite simples teria ajudado mais.'],
['Contar à chefe que a Marina anda estranha, para que alguém converse com ela sobre isso.',{emp:-5,soc:-5,team:-3},'Falar pelas costas, mesmo com boa intenção, quebra a confiança. Primeiro procure a própria pessoa.']]},
{t:'Conversa com Rafael',f:'Equipe',b:'Rafael, irritado: "O Bruno apresentou meu trabalho como se fosse dele. Estou farto."',o:[

['Pedir ao Bruno que corrija o crédito na próxima apresentação, pois o Rafael tem razão.',{team:-2,emp:1},'Você foi solidário, mas decidiu sem ouvir o Bruno. Pode ser injusto e ainda abrir outro conflito.'],
['Dizer ao Rafael que isso é exagero e que o importante mesmo é o resultado da equipe.',{team:-5,emp:-3,soc:-5},'Descartar o incômodo mina a confiança em você. O resultado importa, mas o crédito também.']]},
{t:'Conversa com Júlia',f:'Equipe',b:'Júlia enviou um relatório com números errados ao cliente e está aflita: "Desculpa, fiz tudo errado. Vou ser demitida?"',o:[
['Acolher a aflição dela e combinar juntos como corrigir o relatório e evitar o erro depois.',{emp:6,prob:3,team:3,cust:3},'Você acolheu a emoção e levou a conversa para solução e aprendizado. Assim se cria segurança para errar e melhorar.'],
['Dizer que acontece com todo mundo e pedir que ela corrija o relatório sozinha ainda hoje.',{emp:-2,prob:-1},'Aliviar é gentil, mas sem combinar a correção e a prevenção o erro pode se repetir.'],
['Reunir a equipe e usar o relatório dela como exemplo do que não se deve fazer na empresa.',{emp:-6,soc:-8,team:-4},'Humilhação pública gera medo, não aprendizado. Feedback difícil pede privacidade.']]},
{t:'Conversa com Pedro',f:'Equipe',b:'Pedro pede para sair às 16h: "Sei que o dia está corrido, mas tenho um assunto de família importante hoje."',o:[
['Perguntar se ele precisa de algo, liberar a saída e combinar quem cobre as pendências.',{emp:5,team:3,soc:4},'Confiar e planejar a cobertura cuida da pessoa e da entrega. Flexibilidade com combinados claros funciona.'],

const DS=480,DE=1080,STEP=2,KEY='skillBloomSave3';
const fresh=()=>({money:500,rep:50,soc:50,cust:50,energy:100,day:1,time:DS,skills:{com:72,prob:65,team:58,self:63,emp:70},done:0,missed:0,tasks:[],nid:1,coffee:-999});
let S=fresh(),over=false,view=null,tab='mail',selM=null,dirty=1,tabI=-1,popQ=[],nextEv=0;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const fmt=m=>String(m/60|0).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const role=()=>S.day>=20?'Diretor':S.day>=10?'Gerente':S.day>=5?'Supervisor':'Assistente';
const shift=()=>S.time<720?'manhã':S.time<840?'almoço':S.time<1020?'tarde':'fechamento';
const stress=()=>clamp(S.tasks.length*9+(100-S.energy)*.5);
function rank(){const a=Object.values(S.skills).reduce((x,y)=>x+y,0)/5,t=S.money+(S.rep+S.soc+S.cust)*10+a*20;return t>7500?'S':t>5500?'A':t>3500?'B':t>2500?'C':'D'}
function apply(fx){for(const k in fx){if(k in S.skills)S.skills[k]=clamp(S.skills[k]+fx[k]);else if(k==='money')S.money+=fx[k];else S[k]=clamp(S[k]+fx[k])}}

// ---------- MÉDIA DE DESEMPENHO (vai para o banco pelo Flask) ----------
// pontos: 100 = melhor opção, 50 = razoável, 0 = pior. "pro" = proatividade (quanto mais rápido responde, maior).
let MED=null;
function enviar(habilidade,pontos,pro){
  try{fetch('/api/desempenho/registrar',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({habilidade,pontos,pro}),keepalive:true})
    .then(r=>r.ok?r.json():null).then(d=>{if(d){MED=d;showMed()}}).catch(()=>{})}catch(e){}
}
function showMed(){if(view)renderPanel()}

// ---------- UI BÁSICA ----------
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;$('toasts').appendChild(d);setTimeout(()=>d.remove(),4000)}
function showPopup(x,t='Evento'){popQ.push([t,x]);if($('popup').classList.contains('hidden'))nextPop()}
function nextPop(){const p=popQ.shift();if(!p)return;$('popT').textContent=p[0];$('popX').textContent=p[1];$('popup').classList.remove('hidden')}
function closePopup(){$('popup').classList.add('hidden');nextPop()}
const help=()=>showPopup((COARSE?'Celular: toque nos objetos e deslize para os lados para virar a câmera. ':'')+'Mouse: clique nos objetos 3D. A / D ou setas: virar a câmera entre impressora, estação e telefone. 1-2-3: ir direto a uma estação. E: interagir com a estação. TAB: próxima tarefa. ESC: fechar. Clique na caneca para uma pausa de café. Seus números ficam no Painel, dentro do computador.','Controles');
const paused=()=>!$('popup').classList.contains('hidden')||!$('over').classList.contains('hidden');

// ---------- TAREFAS ----------
function spawn(k){
  if(S.tasks.length>=6||(k==='call'&&S.tasks.some(t=>t.k==='call')))return;
  const pri=Math.random()<.12+S.day*.02?3:Math.random()<.35?2:1,tot=Math.round(TY[k].b/(1+(pri-1)*.3)/(1+S.day*.03));
  const d={o:shuf([0,1,2])};let title,sub;
  if(k==='doc'){d.i=rnd(0,DOCS.length);title=DOCS[d.i][0];sub='Arquivar no setor correto'}
  else if(k==='print'){title='Impressão pendente';sub=pick(['Relatório mensal','Contrato','Apresentação','Ata'])}
  else{d.i=rnd(0,Q[k].length);title=Q[k][d.i].t;sub=Q[k][d.i].f;if(k==='call')toast('O telefone está tocando.')}
  S.tasks.push({id:S.nid++,k,title,sub,tot,left:tot,pri,d});dirty=1;
}
function complete(t,fx,msg,ok,pts){
  const m=[1,1.3,1.6][t.pri-1],f=clamp(1-(stress()-60)/100,.5,1),o={};
  for(const k in fx){let v=fx[k]*m;if(v>0)v*=f;o[k]=Math.round(v)}
  S.tasks=S.tasks.filter(x=>x!==t);S.done++;apply(o);apply({energy:-1.5});dirty=1;
  enviar(Object.keys(o).filter(k=>k in S.skills).sort((a,b)=>Math.abs(o[b])-Math.abs(o[a]))[0]||HAB[t.k],pts!=null?pts:(ok?100:0),Math.round(50+50*clamp(t.left/t.tot,0,1)));
  if(msg)toast(msg);refresh();
}
function expire(t){S.tasks=S.tasks.filter(x=>x!==t);S.missed++;dirty=1;const p={};for(const k in TY[t.k].pen)p[k]=TY[t.k].pen[k]*t.pri;apply(p);enviar(null,0,0);toast('Prazo perdido: '+t.title)}
const opts=t=>Q[t.k][t.d.i].o;
function ans(id,k){const t=S.tasks.find(x=>x.id===id);if(!t)return;const o=opts(t)[k];if(t.k==='call')closePanel();complete(t,o[1],null,k===0,[100,50,0][k]);showPopup(o[2],['Boa escolha','Dá para melhorar','Escolha arriscada'][k])}
const buttons=t=>t.d.o.map(k=>`<button class="ob" onclick="ans(${t.id},${k})">${opts(t)[k][0]}</button>`).join('');
const scen=t=>{const e=Q[t.k][t.d.i];return `<h3>${e.t}</h3><p class="mut">${e.f}</p><p>${e.b}</p>${buttons(t)}`};
function goTask(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;$('tasksP').classList.remove('open');
  if(t.k==='email'){selM=id;tab='mail';act('pc')}if(t.k==='doc'){tab='doc';act('pc')}if(t.k==='emp'){tab='emp';act('pc')}if(t.k==='call')act('phone');if(t.k==='print')act('printer')}

// ---------- PAINÉIS ----------
const item=(t,click)=>`<div class="tk p${t.pri}" onclick="${click}" title="Prioridade ${['normal','alta','urgente'][t.pri-1]}"><span class="pd"></span><div><b>${t.title}</b><small>${t.sub}</small></div></div>`;
const TABS=[['mail','E-mail'],['doc','Arquivos'],['emp','Equipe'],['rep','Painel']];
const bar=v=>`<i class="bar"><u style="width:${clamp(v)}%"></u></i>`,kpi=(l,v,b)=>`<div class="kpi"><span>${l}</span><b>${v}</b>${b||''}</div>`;
function openPanel(v){view=v;$('panel').classList.remove('hidden');renderPanel()}
function closePanel(){view=null;$('panel').classList.add('hidden')}
function setTab(t){tab=t;renderPanel()}
function renderPanel(){
  if(!view)return;let h='';
  $('ptabs').innerHTML=view==='pc'?TABS.map(t=>`<button class="${t[0]===tab?'on':''}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join(''):'';
  $('ptitle').innerHTML=view==='pc'?ic('monitor')+'Estação de trabalho':view==='printer'?ic('printer')+'Impressora':ic('phone')+'Telefone · Atendimento';
  if(view==='pc'){
    if(tab==='mail'){const l=S.tasks.filter(t=>t.k==='email'),t=l.find(x=>x.id===selM);
      h=`<div class="split"><div class="list">${l.map(t=>item(t,`selM=${t.id};renderPanel()`)).join('')||'<div class="empty">Caixa vazia.</div>'}</div><div class="view">${t?scen(t):'<div class="empty">Selecione um e-mail.</div>'}</div></div>`}
    if(tab==='doc')h=S.tasks.filter(t=>t.k==='doc').map(t=>`<div class="doc"><h3>${t.title}</h3><div class="row">${['RH','Financeiro','Jurídico'].map(s=>`<button onclick="sortDoc(${t.id},'${s}')">${s}</button>`).join('')}<button onclick="deleg(${t.id})">Delegar à equipe</button></div></div>`).join('')||'<div class="empty">Nenhum documento pendente.</div>';
    if(tab==='emp'){const t=S.tasks.find(x=>x.k==='emp');h=t?`<div class="view">${scen(t)}</div>`:'<div class="empty">Ninguém da equipe está esperando por você.</div>'}
    if(tab==='rep')h=`<div class="kpis">${kpi('Dinheiro','R$ '+Math.round(S.money))}${kpi('Reputação',Math.round(S.rep),bar(S.rep))}${kpi('Equipe',Math.round(S.soc),bar(S.soc))}${kpi('Clientes',Math.round(S.cust),bar(S.cust))}${kpi('Energia',Math.round(S.energy)+'%',bar(S.energy))}${kpi('Estresse',Math.round(stress())+'%',bar(stress()))}</div><div class="kpis">${Object.entries(SK).map(([k,n])=>kpi(n,Math.round(S.skills[k])+'%',bar(S.skills[k]))).join('')}</div>${MED?`<h3 style="margin:6px 0 10px">Desempenho salvo · média geral ${MED.geral}%</h3><div class="kpis">${MED.competencias.map(c=>kpi(c.n,c.v+'%',bar(c.v))).join('')}</div>`:''}<p class="kline">Dia ${S.day} · ${role()} · Concluídas ${S.done} · Perdidas ${S.missed} · Rank ${rank()}</p>`;
  }
  if(view==='printer')h=S.tasks.filter(t=>t.k==='print').map(t=>`<div class="doc"><h3>${t.sub}</h3><div class="row"><button onclick="printJob(${t.id})">Imprimir e entregar</button></div></div>`).join('')||'<div class="empty">Nenhuma impressão na fila.</div>';
  if(view==='phone'){const t=S.tasks.find(x=>x.k==='call');h=t?`<div class="view">${scen(t)}</div>`:'<div class="empty">Nenhuma ligação no momento.</div>'}
  $('pbody').innerHTML=h;
}
function sortDoc(id,s){const t=S.tasks.find(x=>x.id===id);if(!t)return;const ok=DOCS[t.d.i][1]===s;complete(t,ok?{money:20,rep:2,prob:2}:{rep:-5,prob:-2},ok?'Arquivado corretamente.':'Arquivado no setor errado.',ok)}
function deleg(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;const ok=Math.random()<.7;apply({soc:-3});complete(t,ok?{money:10,team:2}:{rep:-3,team:-1},ok?'A equipe resolveu.':'A equipe errou o setor.',ok)}
function printJob(id){const t=S.tasks.find(x=>x.id===id);if(t)complete(t,{money:20,self:1,rep:1},'Trabalho entregue.',true);renderPanel()}
function coffee(){const n=S.day*1440+S.time;if(n-S.coffee<90)return toast('Você acabou de tomar café.');S.coffee=n;apply({energy:12,self:1});S.tasks.forEach(t=>t.left-=10);toast('Pausa para o café. Você voltou mais disposto.');refresh()}

  const l=S.tasks.slice().sort((a,b)=>b.pri-a.pri||a.left-b.left);
  $('tasks').innerHTML=l.map(t=>item(t,`goTask(${t.id})`)).join('')||'<div class="vazio">Nenhuma tarefa pendente.</div>';

function tick(){
  if(over||paused())return;S.time+=STEP;S.energy=clamp(S.energy-.04);
  const lunch=S.time>=720&&S.time<840,k=Math.min(2,1+S.day*.05)*(lunch?.5:1);
  [['email',.015],['doc',.015],['emp',.008],['call',.012],['print',.01]].forEach(([t,p])=>{if(Math.random()<p*k)spawn(t)});
  S.tasks.forEach(t=>t.left-=STEP);S.tasks.filter(t=>t.left<=0).forEach(expire);
  if(S.time>=nextEv&&S.time<DE-30){nextEv=S.time+rnd(70,130);const e=pick(EV);apply(e[1]);if(e[2])e[2]();showPopup(e[0],'Acontecimento');dirty=1}
  if(S.time>=DE)endDay();refresh();
}
function endDay(){
  const r=rank();S.day++;S.time=DS;nextEv=DS+rnd(60,110);S.money+=50;S.energy=clamp(S.energy+45);
  let x=`Dia ${S.day-1} encerrado. Você concluiu ${S.done} tarefas e perdeu ${S.missed}. Veja os detalhes no Painel do computador.`;
  if(PROMO[S.day]){S.money+=PROMO[S.day][1];x+=` Promoção para ${PROMO[S.day][0]}!`}
  spawn('doc');spawn('doc');spawn('email');save();showPopup(x,'Fim do expediente');
}
function checkOver(){if(over)return;const r=S.rep<=0?'A empresa perdeu toda a reputação.':S.cust<=0?'Os clientes abandonaram a empresa.':S.soc<=0?'A equipe se desligou do trabalho.':S.energy<=0?'Você chegou ao esgotamento (burnout).':S.money<=-500?'A empresa faliu.':'';
  if(r){over=true;try{localStorage.removeItem(KEY)}catch(e){}$('overX').innerHTML=`${r}<br><br>Rank final: ${rank()}`;$('over').classList.remove('hidden')}}

// ---------- CONTROLES ----------
addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('popup').classList.contains('hidden'))closePopup();else closePanel();return}
  if(view)return;const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a')go(st-1);if(k==='arrowright'||k==='d')go(st+1);if(['1','2','3'].includes(k))go(+k-1);
  if(k==='e')act(ST[st].a);
  if(k==='tab'){e.preventDefault();if(S.tasks.length){tabI=(tabI+1)%S.tasks.length;goTask(S.tasks[tabI].id)}}
});


// ---------- TINTA DA IMPRESSORA ----------
document.head.insertAdjacentHTML('beforeend','<style>.ink{display:flex;gap:4px;margin:8px 0}.ink i{flex:1;height:16px;border-radius:3px;background:#1a2f45}.ink i.on{background:#f5c518}.row button:disabled{opacity:.4;cursor:not-allowed;border-color:var(--line)}</style>');
const inkNow=()=>{if(typeof S.ink!=='number')S.ink=100;return S.ink};
function refill(){if(inkNow()>=20){toast('A tinta só pode ser recarregada abaixo de 20%.');return}S.ink=100;toast('Tinta recarregada.');renderPanel()}
const _renderPanel=renderPanel;
renderPanel=function(){
  _renderPanel();
  if(view!=='printer')return;
  const v=inkNow(),bars=Math.ceil(v/10);
  $('pbody').insertAdjacentHTML('afterbegin',`<div class="doc"><h3>Tinta da impressora · ${Math.round(v)}%</h3><div class="ink">${Array.from({length:10},(_,i)=>`<i class="${i<bars?'on':''}"></i>`).join('')}</div><div class="row"><button onclick="refill()" ${v<20?'':'disabled'}>Recarregar tinta</button></div><p class="mut" style="margin:6px 0 0">Cada impressão gasta 1 barra. A recarga só libera abaixo de 20%.</p></div>`);
};
const _printJob=printJob;
printJob=function(id){
  if(!S.tasks.find(x=>x.id===id))return;
  if(inkNow()<10){toast('Sem tinta! Recarregue a impressora.');return}
  S.ink=inkNow()-10;
  _printJob(id);
};

// ---------- INÍCIO ----------
try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.skills)S=Object.assign(fresh(),d)}catch(e){}
if(!S.tasks.length)['email','email','doc','emp','print'].forEach(spawn);
fetch('/api/desempenho/resumo',{credentials:'same-origin'}).then(r=>r.ok?r.json():null).then(d=>{if(d){MED=d;showMed()}}).catch(()=>{});
addEventListener('visibilitychange',()=>{if(document.hidden&&!over)save()});
nextEv=S.time+rnd(60,110);renderNav();refresh();requestAnimationFrame(loop);setInterval(tick,2000);setInterval(()=>{if(!over)save()},10000);
