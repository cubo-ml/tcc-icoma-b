<script>
/* Ritmo mais calmo: o relógio do jogo avança a cada 2 s (o dia dura cerca de 10 min).
   Também faz o tick usar sempre a versão mais recente da função e impede
   que o autosave grave o jogo depois do fim de jogo (isso reabria a partida perdida). */
(function () {
  var si = window.setInterval;
  window.setInterval = function (f, ms) {
    if (f && f.name === "tick") return si(function () { window.tick(); }, ms * 2);
    if (f && f.name === "save") return si(function () { if (!over) f(); }, ms);
    return si.apply(window, arguments);
  };
})();
</script>

<script>
"use strict";
// SkillBloom — Office Simulator (Three.js r128)
const $=i=>document.getElementById(i),clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v)),pick=a=>a[Math.random()*a.length|0],rnd=(a,b)=>a+(Math.random()*(b-a)|0),shuf=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const IC={mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',users:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.5 3-6 6-6s6 2.5 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.5 0 4 2 4 5"/>',phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A15 15 0 0 1 3 6a2 2 0 0 1 2-2z"/>',printer:'<path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/>',chart:'<path d="M4 20V4M4 20h16M8 16v-5M12 16V8M16 16v-3"/>',monitor:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>'};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;

// ---------- CONTEÚDO ----------
const EB={soc:-10,emp:-3},EO={soc:1,com:1},EG={soc:10,rep:5,emp:3,com:2},CB={cust:-10,rep:-5,emp:-2},CO={cust:2,com:1},CG={cust:10,rep:3,money:15,com:3};
const POOL={
 email:[
  {f:'RH',t:'Pedido de Férias',b:'Um funcionário quer tirar férias no próximo mês.',o:[['Aprovar',{soc:5,emp:2}],['Negar',{soc:-10,emp:-2}],['Pedir mais informações',{soc:2,com:3}]]},
  {f:'Financeiro',t:'Corte de Custos',b:'Precisamos reduzir os gastos do escritório.',o:[['Reduzir material',{money:50,soc:-5,prob:2}],['Demitir funcionário',{money:100,soc:-15,emp:-4}],['Ignorar',{rep:-10,self:-2}]]},
  {f:'BANCO URGENTE',t:'CLIQUE IMEDIATAMENTE',b:'Detectamos atividade suspeita. Clique agora.',o:[['Ignorar',{rep:2}],['Clicar no link',{money:-200,rep:-10,self:-3}],['Encaminhar para a TI',{rep:5,soc:3,prob:3}]]},
  {f:'Cliente Alfa',t:'Entrega atrasada',b:'Nosso pedido está 3 dias atrasado e estamos insatisfeitos.',o:[['Pedir desculpas e informar novo prazo',{cust:8,emp:3,com:2}],['Culpar a transportadora',{cust:-6,rep:-3}],['Oferecer desconto',{cust:10,money:-80}]]},
  {f:'Diretoria',t:'Relatório urgente',b:'Preciso do relatório até o fim do dia.',o:[['Aceitar e reorganizar prioridades',{rep:4,self:3,energy:-6}],['Negociar novo prazo',{rep:2,com:3,self:2}],['Aceitar sem questionar',{rep:3,energy:-12,self:-2}]]}],
 emp:[
  {t:'Estou sobrecarregado com tarefas.',o:[['Trabalhe mais.',EB],['Vamos redistribuir as tarefas.',EG],['Não é problema meu.',EB]]},
  {t:'Gostaria de receber treinamento.',o:[['Boa ideia, vou buscar opções.',EG],['Você não precisa.',EB],['Pesquise e me traga sugestões.',EO]]},
  {t:'Posso trabalhar remotamente?',o:[['Sim.',EO],['Não.',EB],['Vamos testar um dia por semana.',EG]]},
  {t:'Meu colega levou o crédito pelo meu trabalho.',o:[['Vou ouvir os dois lados.',EG],['Resolvam entre vocês.',EO],['Isso é besteira.',EB]]}],
 call:[
  {t:'Meu pedido chegou danificado.',o:[['Vamos substituir imediatamente.',CG],['Não podemos ajudar.',CB],['Tente novamente amanhã.',CB]]},
  {t:'Fui cobrado duas vezes.',o:[['Vamos verificar agora.',CG],['Isso é impossível.',CB],['Não sei.',CB]]},
  {t:'Quero cancelar meu contrato.',o:[['Posso saber o motivo? Talvez eu resolva.',CG],['Tudo bem, cancelado.',CO],['Você não pode.',CB]]}]};
const DOCS=[['Contrato de Funcionário','RH'],['Nota Fiscal','Financeiro'],['Processo Judicial','Jurídico'],['Holerite','RH'],['Boleto de Fornecedor','Financeiro'],['Notificação Extrajudicial','Jurídico']];
const EVENTS=[['Bônus da diretoria.',{money:200,self:2}],['A impressora travou papel.',{money:-100},1],['Cliente importante elogiou a empresa.',{rep:10,com:2}],['Equipe desmotivada.',{soc:-10}],['Campanha de marketing funcionou.',{cust:15}],['Queda de energia. Você perdeu o foco.',{energy:-10}]];
const PROMO={5:['Supervisor',500],10:['Gerente',1000],20:['Diretor',2500]};
const SK={com:['Comunicação',''],prob:['Resolução de Problemas','g'],team:['Trabalho em Equipe','y'],self:['Autogestão','p'],emp:['Empatia','r']};
const LB={money:'Dinheiro',rep:'Reputação',soc:'Equipe',cust:'Clientes',energy:'Energia'};
const TY={email:{i:'mail',b:240,pen:{rep:-4,com:-1}},doc:{i:'doc',b:240,pen:{rep:-3,prob:-1}},emp:{i:'users',b:200,pen:{soc:-6,emp:-2}},call:{i:'phone',b:40,pen:{cust:-8,rep:-3}},print:{i:'printer',b:150,pen:{rep:-2}}};

// ---------- ESTADO ----------
const DS=480,DE=1080,STEP=2,KEY='skillBloomSave2';
const fresh=()=>({money:500,rep:50,soc:50,cust:50,energy:100,day:1,time:DS,skills:{com:72,prob:65,team:58,self:63,emp:70},done:0,missed:0,combo:0,toner:100,jam:false,tray:0,tasks:[],nid:1,coffee:-999});
let S=fresh(),over=false,view=null,tab='mail',selM=null,dirty=1,tabI=-1,popQ=[];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const fmt=m=>String(m/60|0).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const role=()=>S.day>=20?'Diretor':S.day>=10?'Gerente':S.day>=5?'Supervisor':'Assistente';
const shift=()=>S.time<720?'MANHÃ':S.time<840?'ALMOÇO':S.time<1020?'TARDE':'FECHAMENTO';
const stress=()=>clamp(S.tasks.length*9+(100-S.energy)*.5);
const fx2=fx=>Object.entries(fx).map(([k,v])=>(v>0?'+':'')+v+' '+((SK[k]||[])[0]||LB[k])).join(' · ');
function rank(){const a=Object.values(S.skills).reduce((x,y)=>x+y,0)/5,t=S.money+(S.rep+S.soc+S.cust)*10+a*20;return t>7500?'S':t>5500?'A':t>3500?'B':t>2500?'C':'D'}
function apply(fx){for(const k in fx){if(k in S.skills)S.skills[k]=clamp(S.skills[k]+fx[k]);else if(k==='money')S.money+=fx[k];else S[k]=clamp(S[k]+fx[k])}}

// ---------- UI BÁSICA ----------
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;$('toasts').appendChild(d);setTimeout(()=>d.remove(),4000)}
function showPopup(x,t='Evento'){popQ.push([t,x]);if($('popup').classList.contains('hidden'))nextPop()}
function nextPop(){const p=popQ.shift();if(!p)return;$('popT').textContent=p[0];$('popX').textContent=p[1];$('popup').classList.remove('hidden')}
function closePopup(){$('popup').classList.add('hidden');nextPop()}
const help=()=>showPopup('Mouse: clique nos objetos 3D. A / D ou setas: virar a câmera entre impressora, estação e telefone. 1-2-3: ir direto a uma estação. E: interagir com a estação. TAB: próxima tarefa. ESC: fechar. Clique na caneca para uma pausa de café.','Controles');
const paused=()=>!$('popup').classList.contains('hidden')||!$('over').classList.contains('hidden');

// ---------- TAREFAS ----------
function spawn(k){
  if(S.tasks.length>=9||(k==='call'&&S.tasks.some(t=>t.k==='call')))return;
  const pri=Math.random()<.12+S.day*.02?3:Math.random()<.35?2:1,tot=Math.round(TY[k].b/(1+(pri-1)*.3)/(1+S.day*.03));
  const d={o:shuf([0,1,2])};let title,sub;
  if(k==='email'){d.i=rnd(0,POOL.email.length);title=POOL.email[d.i].t;sub=POOL.email[d.i].f}
  if(k==='doc'){d.i=rnd(0,DOCS.length);title=DOCS[d.i][0];sub='Arquivar no setor correto'}
  if(k==='emp'||k==='call'){d.i=rnd(0,POOL[k].length);title=k==='emp'?'Conversa com funcionário':'Ligação de cliente';sub=POOL[k][d.i].t;if(k==='call')toast('O telefone está tocando.')}
  if(k==='print'){d.pages=rnd(4,16);d.done=false;title='Impressão pendente';sub=pick(['Relatório mensal','Contrato','Apresentação','Ata'])+' · '+d.pages+' págs'}
  S.tasks.push({id:S.nid++,k,title,sub,tot,left:tot,pri,d});dirty=1;
}
function complete(t,fx,msg){
  const m=[1,1.3,1.6][t.pri-1],f=clamp(1-(stress()-60)/100,.5,1),o={};
  for(const k in fx){let v=fx[k]*m;if(v>0)v*=f;o[k]=Math.round(v)}
  const ok=(o.rep||0)+(o.cust||0)+(o.soc||0)+(o.money||0)>0;S.combo=ok?Math.min(5,S.combo+1):0;if(ok&&S.combo>1)o.money=(o.money||0)+S.combo*5;
  S.tasks=S.tasks.filter(x=>x!==t);S.done++;apply(o);apply({energy:-1.5});dirty=1;
  toast(`${msg} ${fx2(o)}${S.combo>1?' · combo x'+S.combo:''}`);refresh();
}
function expire(t){S.tasks=S.tasks.filter(x=>x!==t);S.missed++;S.combo=0;dirty=1;const p={};for(const k in TY[t.k].pen)p[k]=TY[t.k].pen[k]*t.pri;apply(p);toast(`Prazo perdido: ${t.title} (${fx2(p)})`)}
const opts=t=>t.k==='email'?POOL.email[t.d.i].o:POOL[t.k][t.d.i].o;
function ans(id,k){const t=S.tasks.find(x=>x.id===id);if(!t)return;const o=opts(t)[k];if(t.k==='call')closePanel();complete(t,o[1],t.k==='call'?'Ligação encerrada.':'Resposta enviada.')}
const buttons=t=>t.d.o.map(k=>`<button class="ob" onclick="ans(${t.id},${k})">${opts(t)[k][0]}</button>`).join('');
function goTask(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;
  if(t.k==='email'){selM=id;tab='mail';act('pc')}if(t.k==='doc'){tab='doc';act('pc')}if(t.k==='emp'){tab='emp';act('pc')}if(t.k==='call')act('phone');if(t.k==='print')act('printer')}

// ---------- PAINÉIS ----------
function item(t,click){return `<div class="ti p${t.pri}" onclick="${click}"><div class="tic">${ic(TY[t.k].i)}</div><div><b>${t.title}</b><small>${t.sub}</small><i class="pb"><u style="width:${clamp(t.left/t.tot*100)}%"></u></i></div><time>${Math.max(0,t.left)}m</time></div>`}
const TABS=[['mail','E-mail','mail'],['doc','Arquivos','doc'],['emp','Equipe','users'],['rep','Relatório','chart']];
function openPanel(v){view=v;$('panel').classList.remove('hidden');renderPanel()}
function closePanel(){view=null;$('panel').classList.add('hidden')}
function setTab(t){tab=t;renderPanel()}
function renderPanel(){
  if(!view)return;let h='';
  $('ptabs').innerHTML=view==='pc'?TABS.map(t=>`<button class="${t[0]===tab?'on':''}" onclick="setTab('${t[0]}')">${ic(t[2])}${t[1]}</button>`).join(''):'';
  $('ptitle').innerHTML=view==='pc'?ic('monitor')+'Estação de trabalho':view==='printer'?ic('printer')+'Impressora':ic('phone')+'Telefone · Atendimento';
  if(view==='pc'){
    if(tab==='mail'){const l=S.tasks.filter(t=>t.k==='email'),t=l.find(x=>x.id===selM);let v='<div class="empty">Selecione um e-mail.</div>';
      if(t){const e=POOL.email[t.d.i];v=`<h3>${e.t}</h3><p class="mut">De: ${e.f}</p><p>${e.b}</p>${buttons(t)}`}
      h=`<div class="split"><div class="list">${l.map(t=>item(t,`selM=${t.id};renderPanel()`)).join('')||'<div class="empty">Caixa vazia.</div>'}</div><div class="view">${v}</div></div>`}
    if(tab==='doc')h=S.tasks.filter(t=>t.k==='doc').map(t=>`<div class="doc"><h3>${t.title}</h3><span class="mut">Prazo: ${t.left} min</span><div class="row">${['RH','Financeiro','Jurídico'].map(s=>`<button onclick="sortDoc(${t.id},'${s}')">${s}</button>`).join('')}<button onclick="deleg(${t.id})">Delegar à equipe</button></div></div>`).join('')||'<div class="empty">Nenhum documento pendente.</div>';
    if(tab==='emp'){const t=S.tasks.find(x=>x.k==='emp');h=t?`<div class="view"><h3>${t.sub}</h3>${buttons(t)}</div>`:'<div class="empty">Nenhuma solicitação da equipe.</div>'}
    if(tab==='rep'){const s=Object.entries(S.skills).sort((a,b)=>b[1]-a[1]);h=`<div class="view"><h3>Dia ${S.day} · ${role()}</h3><p>Dinheiro: R$ ${Math.round(S.money)} · Reputação ${Math.round(S.rep)} · Equipe ${Math.round(S.soc)} · Clientes ${Math.round(S.cust)}</p><p>Concluídas: ${S.done} · Perdidas: ${S.missed} · Pendentes: ${S.tasks.length}</p><p>Combo atual: x${Math.max(1,S.combo)} · Estresse: ${Math.round(stress())}%</p><p>Rank: <b>${rank()}</b></p><p class="mut">Ponto forte: ${SK[s[0][0]][0]} · A desenvolver: ${SK[s[4][0]][0]}</p></div>`}
  }
  if(view==='printer'){const j=S.tasks.filter(t=>t.k==='print'&&!t.d.done);
    h=`<div class="big">${S.jam?'ATOLAMENTO':S.toner<15?'TONER BAIXO':'PRONTA'}</div><p class="mut">Toner ${Math.round(S.toner)}%</p><div class="meter"><u style="width:${S.toner}%"></u></div><p>Fila: ${j.length} · Bandeja: ${S.tray} págs</p><div class="row">${S.jam?'<button onclick="clearJam()">Desatolar papel</button>':''}${j.length?'<button onclick="printJob()">Imprimir próximo</button>':''}${S.tray?'<button onclick="collect()">Coletar páginas</button>':''}<button onclick="newToner()">Trocar toner (R$ 60)</button></div>`}
  if(view==='phone'){const t=S.tasks.find(x=>x.k==='call');
    h=t?`<div class="view"><p class="mut">Cliente na linha · ${t.left} min de paciência</p><h3>"${t.sub}"</h3>${buttons(t)}</div>`:'<div class="empty">Nenhuma ligação no momento.</div>'}
  $('pbody').innerHTML=h;
}
function sortDoc(id,s){const t=S.tasks.find(x=>x.id===id);if(!t)return;const ok=DOCS[t.d.i][1]===s;complete(t,ok?{money:20,rep:2,prob:1}:{rep:-5,prob:-2},ok?'Arquivado corretamente.':'Arquivado no setor errado.')}
function deleg(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;const ok=Math.random()<.7;apply({soc:-3});complete(t,ok?{money:10,prob:1}:{rep:-3},ok?'A equipe resolveu.':'A equipe errou o setor.')}
function printJob(){const j=S.tasks.find(t=>t.k==='print'&&!t.d.done);if(!j)return;if(S.jam)return toast('Papel atolado.');if(S.toner<j.d.pages)return toast('Toner insuficiente.');
  S.toner-=j.d.pages;if(Math.random()<.12){S.jam=true;toast('O papel atolou!')}else{j.d.done=true;S.tray+=j.d.pages;toast('Impresso. Colete as páginas.')}refresh();renderPanel()}
function collect(){S.tasks.filter(t=>t.k==='print'&&t.d.done).forEach(t=>complete(t,{money:20,prob:1,rep:1},'Trabalho entregue.'));S.tray=0;renderPanel()}
function clearJam(){S.jam=false;apply({energy:-2,prob:2});refresh();renderPanel()}
function newToner(){if(S.money<60)return toast('Dinheiro insuficiente.');S.money-=60;S.toner=100;apply({self:1});refresh();renderPanel()}
function coffee(){const n=S.day*1440+S.time;if(n-S.coffee<90)return toast('Você acabou de tomar café.');S.coffee=n;apply({energy:12,self:1});S.tasks.forEach(t=>t.left-=10);toast('Pausa para o café: +12 Energia, 10 min gastos.');refresh()}

// ---------- CENA 3D ----------
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0a0f14);scene.fog=new THREE.Fog(0x0a0f14,9,20);
const cam=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,60);
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.1;R.outputEncoding=THREE.sRGBEncoding;$('scene').appendChild(R.domElement);
const M=(c,r=.75,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
function B(g,w,h,d,mt,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mt);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;g.add(m);return m}
function CY(g,r,h,mt,x,y,z){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,20),mt);m.position.set(x,y,z);m.castShadow=true;g.add(m);return m}
function CV(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d'),t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return{draw(){fn(x,w,h);t.needsUpdate=true},tex:t}}
function PL(g,w,h,tex,x,y,z,ry=0){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tex}));m.position.set(x,y,z);m.rotation.y=ry;g.add(m);return m}
function WL(w,h,x,y,z,rx,ry,mt){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mt);m.position.set(x,y,z);m.rotation.set(rx,ry,0);m.receiveShadow=true;scene.add(m)}
const wood=M(0x5a3f2c,.5),dark=M(0x1b2228,.5,.4),paper=M(0xe8e2d2,.9),white=M(0xdfe3e6,.45);
const fc=document.createElement('canvas');fc.width=fc.height=512;const fx=fc.getContext('2d');
for(let i=0;i<8;i++){fx.fillStyle=`hsl(28,${28+Math.random()*8}%,${20+Math.random()*7}%)`;fx.fillRect(0,i*64,512,62);fx.fillStyle='rgba(0,0,0,.35)';fx.fillRect(0,i*64+62,512,2)}
const ft=new THREE.CanvasTexture(fc);ft.wrapS=ft.wrapT=THREE.RepeatWrapping;ft.repeat.set(3,2);ft.encoding=THREE.sRGBEncoding;
const wallM=M(0x1c2a36,.95);
WL(14,10,0,0,-.5,-Math.PI/2,0,new THREE.MeshStandardMaterial({map:ft,roughness:.55}));
WL(14,3.4,0,1.7,-4,0,0,wallM);WL(10,3.4,-7,1.7,-.5,0,Math.PI/2,wallM);WL(10,3.4,7,1.7,-.5,0,-Math.PI/2,wallM);WL(14,10,0,3.4,-.5,Math.PI/2,0,M(0x121a21,1));

  INT.forEach(g => g.traverse(o => {

  };

  /* ---------- Conexão com o site: cada tarefa concluída ou perdida vai para o banco ---------- */
  const HAB = { email: "com", doc: "prob", emp: "emp", call: "com", print: "self" };

  function enviar(habilidade, acertou) {
    try {
      fetch("/api/missao", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ habilidade, acertou }),
        keepalive: true
      }).catch(() => {});
    } catch (e) {}
  }

  const completeOriginal = window.complete;
  window.complete = function (t, fx, msg) {
    const hab = Object.keys(fx).find(k => k in SK) || HAB[t.k];
    const ok = ((fx.rep || 0) + (fx.cust || 0) + (fx.soc || 0) + (fx.money || 0)) > 0;
    enviar(hab, ok);
    completeOriginal(t, fx, msg);
  };

  const expireOriginal = window.expire;
  window.expire = function (t) {
    enviar(HAB[t.k], false);
    expireOriginal(t);
  };
})();
</script>
