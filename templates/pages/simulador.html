<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillBloom — Office Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
{% raw %}
<style>
:root{--ink:#e4eef8;--mut:#8da3b8;--line:#1e3b57;--ac:#3d9bff;--warn:#e0a82e;--bad:#ff6b88;--pn:#0b1622;--pn2:#101f30}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#070d14;color:var(--ink);font:14px Inter,Arial,sans-serif}
#scene{position:fixed;inset:0}#scene canvas{display:block;width:100%;height:100%}
button{font:inherit;cursor:pointer}.hidden{display:none!important}
.ic{width:18px;height:18px;flex:none}
header{position:fixed;top:0;left:0;right:0;height:56px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;background:#070d14d9;border-bottom:1px solid var(--line);backdrop-filter:blur(10px);z-index:10}
.brand{font-weight:700;font-size:18px}.brand b{color:var(--ac)}
.hc{display:flex;gap:14px;align-items:baseline;color:var(--mut)}#clock{font-size:20px;font-weight:700;color:var(--ink)}
.hr{display:flex;gap:8px;align-items:center}#status{color:var(--bad);margin-right:8px;font-size:12px}
.hr button{background:var(--pn);border:1px solid var(--line);color:var(--ink);padding:7px 12px;border-radius:7px}.hr button:hover{border-color:var(--ac)}
#tasksP{position:fixed;right:16px;top:72px;width:290px;max-height:calc(100vh - 170px);overflow:auto;z-index:9;background:#0b1622ea;border:1px solid var(--line);border-radius:12px;padding:12px 14px;backdrop-filter:blur(10px);box-shadow:0 10px 30px #00000066}
.pt{font-weight:600;margin-bottom:4px}
.tk{display:flex;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}.tk:last-child{border:0}.tk:hover{background:#12263a}
.pd{width:9px;height:9px;margin-top:5px;border-radius:50%;background:var(--ac);flex:none}.tk.p2 .pd{background:var(--warn)}.tk.p3 .pd{background:var(--bad)}
.tk b{display:block;font-size:13px}.tk small{color:var(--mut);font-size:12px;line-height:1.35}
.vazio{padding:12px 0;text-align:center;color:var(--mut)}
#nav{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:10px;z-index:9}
#nav button{display:flex;align-items:center;gap:8px;background:#0b1622e6;border:1px solid var(--line);color:var(--ink);padding:11px 16px;border-radius:10px}
#nav button.on{background:var(--ac);border-color:var(--ac);color:#04142b}
#hint{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);font-size:12px;color:var(--mut);background:#070d14cc;padding:6px 14px;border-radius:20px;z-index:9;white-space:nowrap}
.ov{position:fixed;inset:0;z-index:50;background:#000000aa;backdrop-filter:blur(4px);display:grid;place-items:center}#popup,#over{z-index:90}
.card{width:min(960px,94vw);height:min(580px,80vh);background:var(--pn);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px #000000aa}
.card.sm{width:460px;height:auto;padding:26px;text-align:center}.card.sm h2{margin:0 0 10px}.card.sm p{color:var(--mut);line-height:1.6;margin:0 0 16px}
.ch{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--pn2)}.ch h2{margin:0;font-size:15px;display:flex;align-items:center;gap:9px;flex:1}
#ptabs{display:flex;gap:6px}#ptabs button{background:none;border:1px solid transparent;color:var(--mut);padding:7px 11px;border-radius:7px}#ptabs button.on{background:#12304d;border-color:var(--ac);color:var(--ink)}
.x{background:none;border:0;color:var(--mut);font-size:24px}
#pbody{flex:1;overflow:auto;padding:16px}
.split{display:grid;grid-template-columns:280px 1fr;gap:14px;height:100%}.list,.view{overflow:auto}.view{background:var(--pn2);border:1px solid var(--line);border-radius:10px;padding:16px}.view h3{margin:0 0 4px}
.empty{text-align:center;color:var(--mut);padding:60px 10px}.mut{color:var(--mut);font-size:12px}
.ob,.pri{display:block;width:100%;text-align:left;margin-top:8px;background:var(--pn2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:11px 13px;line-height:1.4}.ob:hover{border-color:var(--ac);background:#12304d}
.pri{text-align:center;background:var(--ac);color:#04142b;font-weight:600;border:0}
.row{display:flex;gap:8px;flex-wrap:wrap}.row button{margin-top:8px;background:var(--pn2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 13px}.row button:hover{border-color:var(--ac)}
.doc{background:var(--pn2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px}.doc h3{margin:0 0 4px;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.kpi{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--pn2)}.kpi span{font-size:12px;color:var(--mut)}.kpi b{display:block;margin:4px 0 8px;font-size:22px}
.bar{display:block;height:5px;border-radius:9px;background:#1a2f45;overflow:hidden}.bar u{display:block;height:100%;background:var(--ac)}
.kline{font-size:13px;color:var(--mut)}
#toasts{position:fixed;right:20px;bottom:24px;z-index:95;display:flex;flex-direction:column;gap:7px}
.toast{background:var(--pn);border:1px solid var(--line);color:var(--ink);padding:10px 14px;border-radius:8px;font-size:13px;max-width:320px;box-shadow:0 8px 24px #00000066;animation:t .25s}@keyframes t{from{opacity:0;transform:translateY(8px)}}
@media(max-width:900px){#tasksP{width:240px}.split{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}#nav button span{display:none}}
</style>
{% endraw %}
</head>
<body>
<div id="scene"></div>

<header>
  <div class="brand">Skill<b>Bloom</b></div>
  <div class="hc"><span id="clock">08:00</span><span id="dayInfo"></span></div>
  <div class="hr"><span id="status"></span><button onclick="location.href='/dash'">Meu desempenho</button><button onclick="save();toast('Progresso salvo.')">Salvar</button><button onclick="help()">Controles</button></div>

<div id="panel" class="ov hidden"><div class="card">
  <div class="ch"><h2 id="ptitle"></h2><div id="ptabs"></div><button class="x" onclick="closePanel()">×</button></div>
  <div id="pbody"></div>
</div></div>
<div id="popup" class="ov hidden"><div class="card sm"><h2 id="popT"></h2><p id="popX"></p><button class="pri" onclick="closePopup()">Continuar</button></div></div>
<div id="over" class="ov hidden"><div class="card sm"><h2>Expediente encerrado</h2><p id="overX"></p><button class="pri" onclick="location.reload()">Reiniciar</button></div></div>
<div id="toasts"></div>

<script>

// ---------- CONTEÚDO: cada opção = [texto, efeitos, feedback]; ordem fixa: melhor, razoável, pior ----------
const Q={
email:[

{t:'Pedido de ajuda',f:'Bruno, colega',b:'"Sei que sua semana está cheia, mas consegue revisar minha apresentação hoje? Estou travado."',o:[

{t:'Três pedidos urgentes',f:'Financeiro, Diretoria e Comercial',b:'As três áreas pedem "para ontem": fechamento de caixa, uma proposta e dados para a reunião.',o:[
['Listo prazo e impacto de cada um e alinho com os três o que sai primeiro.',{prob:5,com:4,rep:3},'Priorizar por impacto e combinar expectativas evita promessas que você não cumpre. É resolução de problemas com comunicação.'],
['Faço na ordem em que chegaram.',{prob:-1,rep:-2},'A ordem de chegada nem sempre é a de importância. Sem avaliar impacto, o mais crítico pode atrasar.'],
['Prometo os três para hoje.',{prob:-4,self:-3,rep:-5,energy:-10},'Prometer o impossível gera estresse e quebra de confiança. Dizer o que é viável é mais honesto.']]},
{t:'Discussão por e-mail',f:'Carla e Diego, com você em cópia',b:'Os dois trocam acusações na thread: "Você nunca avisa nada" e "E você nunca lê o que eu mando".',o:[

['Ignoro, esperando que se resolvam.',{team:-2,soc:-3},'Conflitos sem mediação tendem a escalar e contaminar o clima.'],

{t:'URGENTE: conta bloqueada',f:'banco-seguranca@avisos-online.net',b:'"Detectamos atividade suspeita. Clique agora para evitar o bloqueio."',o:[

emp:[

{t:'Conversa com Rafael',f:'Equipe',b:'Rafael, irritado: "O Bruno apresentou meu trabalho como se fosse dele. Estou farto."',o:[

['Peço que resolvam entre eles.',{emp:-1,team:-2},'Incentivar autonomia é bom, mas sem apoio um conflito de crédito costuma piorar.'],

{t:'Conversa com Júlia',f:'Equipe',b:'Júlia enviou um relatório com números errados ao cliente e está aflita: "Desculpa, fiz tudo errado. Vou ser demitida?"',o:[

['Digo "acontece" e mando corrigir sozinha.',{emp:-1,prob:-1},'Aliviar é gentil, mas sem combinar correção e prevenção o erro pode se repetir.'],
['Repreendo na frente de todos para servir de exemplo.',{emp:-6,soc:-8,team:-4},'Humilhação pública gera medo, não aprendizado. Feedback difícil pede privacidade.']]},
{t:'Conversa com Pedro',f:'Equipe',b:'Pedro pede para sair às 16h: "Sei que o dia está corrido, mas tenho um assunto de família importante hoje."',o:[

function spawn(k){
  if(S.tasks.length>=6||(k==='call'&&S.tasks.some(t=>t.k==='call')))return;
  const pri=Math.random()<.12+S.day*.02?3:Math.random()<.35?2:1,tot=Math.round(TY[k].b/(1+(pri-1)*.3)/(1+S.day*.03));
  const d={o:shuf([0,1,2])};let title,sub;
  if(k==='doc'){d.i=rnd(0,DOCS.length);title=DOCS[d.i][0];sub='Arquivar no setor correto'}
  else if(k==='print'){title='Impressão pendente';sub=pick(['Relatório mensal','Contrato','Apresentação','Ata'])}
  else{d.i=rnd(0,Q[k].length);title=Q[k][d.i].t;sub=Q[k][d.i].f;if(k==='call')toast('O telefone está tocando.')}
  S.tasks.push({id:S.nid++,k,title,sub,tot,left:tot,pri,d});dirty=1;
}
function complete(t,fx,msg,ok){
  const m=[1,1.3,1.6][t.pri-1],f=clamp(1-(stress()-60)/100,.5,1),o={};
  for(const k in fx){let v=fx[k]*m;if(v>0)v*=f;o[k]=Math.round(v)}
  S.tasks=S.tasks.filter(x=>x!==t);S.done++;apply(o);apply({energy:-1.5});dirty=1;
  enviar(Object.keys(o).filter(k=>k in S.skills).sort((a,b)=>Math.abs(o[b])-Math.abs(o[a]))[0]||HAB[t.k],ok);
  if(msg)toast(msg);refresh();
}
function expire(t){S.tasks=S.tasks.filter(x=>x!==t);S.missed++;dirty=1;const p={};for(const k in TY[t.k].pen)p[k]=TY[t.k].pen[k]*t.pri;apply(p);enviar(HAB[t.k],false);toast('Prazo perdido: '+t.title)}
const opts=t=>Q[t.k][t.d.i].o;
function ans(id,k){const t=S.tasks.find(x=>x.id===id);if(!t)return;const o=opts(t)[k];if(t.k==='call')closePanel();complete(t,o[1],null,k===0);showPopup(o[2],['Boa escolha','Dá para melhorar','Escolha arriscada'][k])}

function renderPanel(){
  if(!view)return;let h='';
  $('ptabs').innerHTML=view==='pc'?TABS.map(t=>`<button class="${t[0]===tab?'on':''}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join(''):'';
  $('ptitle').innerHTML=view==='pc'?ic('monitor')+'Estação de trabalho':view==='printer'?ic('printer')+'Impressora':ic('phone')+'Telefone · Atendimento';
  if(view==='pc'){

      h=`<div class="split"><div class="list">${l.map(t=>item(t,`selM=${t.id};renderPanel()`)).join('')||'<div class="empty">Caixa vazia.</div>'}</div><div class="view">${t?scen(t):'<div class="empty">Selecione um e-mail.</div>'}</div></div>`}

    if(tab==='rep')h=`<div class="kpis">${kpi('Dinheiro','R$ '+Math.round(S.money))}${kpi('Reputação',Math.round(S.rep),bar(S.rep))}${kpi('Equipe',Math.round(S.soc),bar(S.soc))}${kpi('Clientes',Math.round(S.cust),bar(S.cust))}${kpi('Energia',Math.round(S.energy)+'%',bar(S.energy))}${kpi('Estresse',Math.round(stress())+'%',bar(stress()))}</div><div class="kpis">${Object.entries(SK).map(([k,n])=>kpi(n,Math.round(S.skills[k])+'%',bar(S.skills[k]))).join('')}</div><p class="kline">Dia ${S.day} · ${role()} · Concluídas ${S.done} · Perdidas ${S.missed} · Rank ${rank()}</p>`;

  $('pbody').innerHTML=h;
}
function sortDoc(id,s){const t=S.tasks.find(x=>x.id===id);if(!t)return;const ok=DOCS[t.d.i][1]===s;complete(t,ok?{money:20,rep:2,prob:2}:{rep:-5,prob:-2},ok?'Arquivado corretamente.':'Arquivado no setor errado.',ok)}

const ray=new THREE.Raycaster(),mv=new THREE.Vector2();let hot=null;
function glow(g,on){g.traverse(o=>{if(o.material&&o.material.emissive)o.material.emissive.setHex(on?0x1a4a7a:0)})}
function hit(e){mv.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);mx=mv.x*.5;ray.setFromCamera(mv,cam);const h=ray.intersectObjects(INT,true)[0];if(!h)return null;let o=h.object;while(o&&!o.userData.act)o=o.parent;return o}
R.domElement.addEventListener('mousemove',e=>{const o=hit(e);if(o!==hot){if(hot)glow(hot,0);hot=o;if(o)glow(o,1);R.domElement.style.cursor=o?'pointer':'default'}});
R.domElement.addEventListener('click',e=>{if(view)return;const o=hit(e);if(o)act(o.userData.act)});
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
function loop(t){requestAnimationFrame(loop);cur.lerp(cp,.045);curL.lerp(cl,.045);
  cam.position.set(cur.x+mx*.2,cur.y+Math.sin(t/1800)*.012,cur.z);cam.lookAt(curL.x+mx*.35,curL.y,curL.z);
  HG.rotation.z=ring()?Math.sin(t/40)*.006:0;R.render(scene,cam)}

// ---------- HUD / CICLO ----------
function renderHUD(){
  $('clock').textContent=fmt(S.time);$('dayInfo').textContent=`Dia ${S.day} · ${role()} · ${shift()}`;
  $('status').textContent=stress()>70?'Você está sobrecarregado':S.energy<30?'Você está cansado':'';
  const l=S.tasks.slice().sort((a,b)=>b.pri-a.pri||a.left-b.left);
  $('tasks').innerHTML=l.map(t=>item(t,`goTask(${t.id})`)).join('')||'<div class="vazio">Nenhuma tarefa pendente.</div>';
  const f=(S.time-DS)/(DE-DS);sun.intensity=.55-.25*f;sun.color.setHSL(.11-.04*f,.7,.7);
  [scrM,scrP,scrT,scrC].forEach(s=>s.draw());
}
function refresh(){renderHUD();if(dirty){renderPanel();dirty=0}checkOver()}
function tick(){
  if(over||paused())return;S.time+=STEP;S.energy=clamp(S.energy-.04);
  const lunch=S.time>=720&&S.time<840,k=Math.min(2,1+S.day*.05)*(lunch?.5:1);
  [['email',.015],['doc',.015],['emp',.008],['call',.012],['print',.01]].forEach(([t,p])=>{if(Math.random()<p*k)spawn(t)});
  S.tasks.forEach(t=>t.left-=STEP);S.tasks.filter(t=>t.left<=0).forEach(expire);
  if(S.time>=nextEv&&S.time<DE-30){nextEv=S.time+rnd(70,130);const e=pick(EV);apply(e[1]);if(e[2])e[2]();showPopup(e[0],'Acontecimento');dirty=1}
  if(S.time>=DE)endDay();refresh();
}
function endDay(){
  const r=rank();S.day++;S.time=DS;nextEv=DS+rnd(60,110);S.money+=50;S.energy=clamp(S.energy+45);
  let x=`Dia ${S.day-1} encerrado. Você concluiu ${S.done} tarefas e perdeu ${S.missed}. Veja os detalhes no Painel do computador.`;
  if(PROMO[S.day]){S.money+=PROMO[S.day][1];x+=` Promoção para ${PROMO[S.day][0]}!`}
  spawn('doc');spawn('doc');spawn('email');save();showPopup(x,'Fim do expediente');
}
function checkOver(){if(over)return;const r=S.rep<=0?'A empresa perdeu toda a reputação.':S.cust<=0?'Os clientes abandonaram a empresa.':S.soc<=0?'A equipe se desligou do trabalho.':S.energy<=0?'Você chegou ao esgotamento (burnout).':S.money<=-500?'A empresa faliu.':'';
  if(r){over=true;try{localStorage.removeItem(KEY)}catch(e){}$('overX').innerHTML=`${r}<br><br>Rank final: ${rank()}`;$('over').classList.remove('hidden')}}

// ---------- CONTROLES ----------
addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('popup').classList.contains('hidden'))closePopup();else closePanel();return}
  if(view)return;const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a')go(st-1);if(k==='arrowright'||k==='d')go(st+1);if(['1','2','3'].includes(k))go(+k-1);
  if(k==='e')act(ST[st].a);
  if(k==='tab'){e.preventDefault();if(S.tasks.length){tabI=(tabI+1)%S.tasks.length;goTask(S.tasks[tabI].id)}}
});

// ---------- INÍCIO ----------
try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.skills)S=Object.assign(fresh(),d)}catch(e){}
if(!S.tasks.length)['email','email','doc','emp','print'].forEach(spawn);
nextEv=S.time+rnd(60,110);renderNav();refresh();requestAnimationFrame(loop);setInterval(tick,2000);setInterval(()=>{if(!over)save()},10000);
</script>
